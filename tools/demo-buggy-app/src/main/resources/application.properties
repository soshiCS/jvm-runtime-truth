spring.application.name=demo-buggy-app
# Suppress noisy Spring Boot startup banner in demo output
spring.main.banner-mode=off
# Quiet the logging so bug output is readable
logging.level.root=WARN
logging.level.com.example.demo=INFO
# Use a fixed port for demo curl commands
server.port=8090

# Bug 1v2: Config-driven handler class mappings (keys are lowercase event type names)
notification.handlers.delivery=com.example.demo.bug1.AuditHandler
notification.handlers.alert=com.example.demo.bug1.DeliveryHandler
notification.handlers.audit=com.example.demo.bug1.AuditHandler
notification.handlers.email=com.example.demo.bug1v2.EmailHandler
notification.handlers.sms=com.example.demo.bug1v2.SmsHandler
notification.handlers.push=com.example.demo.bug1v2.PushHandler
