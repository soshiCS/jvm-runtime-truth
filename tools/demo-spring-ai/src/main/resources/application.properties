server.port=19200

# Full TRACE logging for all Spring AI internals
logging.level.org.springframework.ai=TRACE
logging.level.org.springframework.ai.tool=TRACE
logging.level.org.springframework.ai.chat=TRACE
logging.level.org.springframework.ai.model=TRACE
logging.level.org.springframework.ai.support=TRACE
logging.level.com.example.springaidemo=INFO

# Log format: show logger name so we can see which class is logging
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{60} - %msg%n
